version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident-search-api
    environment:
      - ES_URL=${ES_URL}
      - ES_API_KEY=${ES_API_KEY}
      - ES_INDEX=${ES_INDEX:-police-incidents}
      - LLM_INFERENCE_ID=${LLM_INFERENCE_ID:-redhat-granite}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - DEBUG=${DEBUG:-false}
    volumes:
      # Mount backend source for hot-reload
      - ./backend:/app
    ports:
      - "8000:8000"
    # Use reload mode for development
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-search-ui
    environment:
      - REACT_APP_API_URL=/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# Usage:
# 1. Copy .env.example to .env and fill in your credentials
# 2. docker-compose up -d --build
# 3. Access at http://localhost:3000
#
# For code changes:
# - Backend: Edit files in ./backend/ - changes auto-reload
# - Frontend: Requires rebuild: docker-compose up -d --build frontend
