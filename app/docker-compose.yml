version: '3.8'

services:
  backend:
    image: ghcr.io/blakebholden/elastic-ai-workshop-backend:latest
    container_name: incident-search-api
    environment:
      - ES_URL=${ES_URL}
      - ES_API_KEY=${ES_API_KEY}
      - ES_INDEX=${ES_INDEX:-police-incidents}
      - HYBRID_ENABLED=${HYBRID_ENABLED:-false}
      - RAG_ENABLED=${RAG_ENABLED:-false}
      - LLM_INFERENCE_ID=${LLM_INFERENCE_ID:-redhat-granite}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_ID=${AGENT_ID:-police-investigation-assistant}
      - KIBANA_URL=${KIBANA_URL}
      - DEBUG=${DEBUG:-false}
      # Metrics / Observability
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - METRICS_INDEX=${METRICS_INDEX:-app-metrics}
      - SESSION_ID=${SESSION_ID:-default}
      # Remote metrics for instructor dashboard
      - REMOTE_METRICS_ENABLED=${REMOTE_METRICS_ENABLED:-false}
      - REMOTE_METRICS_URL=${REMOTE_METRICS_URL}
      - REMOTE_METRICS_API_KEY=${REMOTE_METRICS_API_KEY}
      - REMOTE_METRICS_INDEX=${REMOTE_METRICS_INDEX:-workshop-metrics}
    volumes:
      # Mount backend source for hot-reload
      - ./backend:/app
    ports:
      - "8000:8000"
    # Use reload mode for development
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ghcr.io/blakebholden/elastic-ai-workshop-frontend:latest
    container_name: incident-search-ui
    environment:
      - REACT_APP_API_URL=/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# Usage:
# 1. Copy .env.example to .env and fill in your credentials
# 2. docker-compose up -d
# 3. Access at http://localhost:3000
#
# Images are pre-built and hosted on GitHub Container Registry.
# Backend code changes auto-reload via volume mount.
